name: Deploy

# Vercel's native Git integration cannot be used here: this repository is
# private and owned by an organisation, which the Hobby plan does not support
# ("The repository is private and owned by an organization... Upgrade to Pro").
# This workflow does the same job through the CLI.
#
# Both apps live in one repo, so each job deploys from the repository root with
# its own --local-config. Deploying from apps/<name> alone fails: Vercel would
# upload only that directory and the workspace packages it depends on would be
# missing, so npm install exits 1.
#
# Required repository secrets:
#   VERCEL_TOKEN   - create at https://vercel.com/account/tokens
#   VERCEL_ORG_ID  - team_jKChA5mnZMI7QJqLnN1gJdu9

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Deploy to a preview URL instead of production"
        type: boolean
        default: false

concurrency:
  # One deploy at a time per app; a newer push supersedes an in-flight one.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      # Don't let a failing admin deploy cancel the clubs one.
      fail-fast: false
      # One at a time. `vercel deploy` builds on Vercel and waits, and the
      # plan allows one concurrent build -- so running both apps at once made
      # the second sit in "Building…" with no output until it was killed,
      # which reads exactly like a hang.
      max-parallel: 1
      matrix:
        include:
          - app: admin
            config: vercel.admin.json
            project_id_secret: VERCEL_PROJECT_ID_ADMIN
          - app: clubs
            config: vercel.clubs.json
            project_id_secret: VERCEL_PROJECT_ID_CLUBS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Deploy only what passes. The verify workflow runs independently, so
      # without this a broken build could still reach a URL people are using.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

      - name: Deploy ${{ matrix.app }}
        # `vercel deploy` creates the deployment, then waits for Vercel to
        # build it, and only promotes the production alias once that
        # finishes. Killing the step therefore leaves a built deployment
        # that no domain points at -- which is what happened on 2026-10-08:
        # the run failed, the deployment existed, and the live site silently
        # stayed on the previous build.
        #
        # So the budget has to cover a real Vercel build, not just a fast
        # one. Thirty minutes, with max-parallel above so the two apps are
        # not queued behind each other inside it.
        timeout-minutes: 30
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set — add it in Settings → Secrets → Actions." >&2
            exit 1
          fi
          # A push to main goes to production. This defaulted to a preview
          # and only promoted on a manual dispatch, so every push since the
          # workflow was written deployed to a throwaway URL and the live
          # domains stayed on whatever was last promoted by hand -- while the
          # run still reported success.
          PROD="--prod"
          if [ "${{ github.event.inputs.preview_only }}" = "true" ]; then
            PROD=""
          fi
          echo "Deploying ${{ matrix.app }} ${PROD:+to production}${PROD:-as a preview}"
          npx vercel@latest deploy $PROD \
            --local-config ${{ matrix.config }} \
            --token "$VERCEL_TOKEN" \
            --yes | tee deploy-url.txt

      - name: Summary
        run: |
          ENV="production"
          [ "${{ github.event.inputs.preview_only }}" = "true" ] && ENV="preview"
          echo "**${{ matrix.app }}** ($ENV) → $(tail -1 deploy-url.txt)" >> "$GITHUB_STEP_SUMMARY"
